<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peaceful Vibes</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://www.w3schools.com/w3images/nature.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        .content {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 2em;
            margin-bottom: 20px;
            font-weight: normal;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #76b852;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .button:hover {
            background-color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Peaceful Vibes</h1>
        <h2>Welcome to 7CC</h2>
        <p>
            Find tranquility in the simplicity of life. Embrace the calm, breathe deeply, and let the serenity of the moment wash over you.
        </p>
        <a class="button" onclick="playMusic()">Feel the Calm</a>
        <audio id="calmMusic" src="https://www.example.com/path-to-your-music-file.mp3"></audio>
    </div>

    <script>
        function playMusic() {
            var music = document.getElementById("calmMusic");
            music.play();
        }
    </script>
</body>
</html>
